services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tabbytally
      POSTGRES_USER: tabbytally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - mail-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabbytally -d tabbytally"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  listener:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  mail-data:
